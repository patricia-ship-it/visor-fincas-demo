# netlify.toml
#
# IMPORTANTE: si ya tienes un netlify.toml en el repo, NO lo sobrescribas
# con este archivo. En su lugar, añade solo la línea `functions = "netlify/functions"`
# dentro de tu bloque [build] existente.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  node_bundler = "esbuild"
